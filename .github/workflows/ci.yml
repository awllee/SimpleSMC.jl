name: CI

on:
  pull_request:
  push:
    branches: [master, main]
    tags: '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Codecov authenticates with OIDC instead of a stored token.
    env:
      JULIA_NUM_THREADS: "2,1" # Exercise task-local RNGs; the SMC algorithm is serial.
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Use both companion default branches until their 0.7 releases are registered.
      - name: Check out companion algorithm
        uses: actions/checkout@v7
        with:
          repository: awllee/SequentialMonteCarlo.jl
          path: .ci/SequentialMonteCarlo
          persist-credentials: false
      - name: Check out companion examples
        uses: actions/checkout@v7
        with:
          repository: awllee/SMCExamples.jl
          path: .ci/SMCExamples
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Run tests
        shell: julia --color=yes {0}
        env:
          CI_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1' }}
        run: |
          using Pkg
          # Resolve each Julia version independently of the committed manifest.
          # Resolve the unregistered package with both companion checkouts.
          Pkg.activate(; temp=true)
          Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path=joinpath(pwd(), ".ci", "SequentialMonteCarlo")),
            PackageSpec(path=joinpath(pwd(), ".ci", "SMCExamples")),
          ])
          Pkg.test("SimpleSMC";
            coverage=ENV["CI_COVERAGE"] == "true",
            julia_args=["--check-bounds=yes"])
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          files: lcov.info
          use_oidc: true
